  <text x="480" y="74" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">On-Chain Slippage Circuit Breaker &amp; Oracle TWAP Protection Vault (Anchor 0.30+)</text>

  <!-- 3 Main Columns / Containers -->
