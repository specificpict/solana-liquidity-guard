  <rect x="60" y="250" width="220" height="60" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="170" y="276" fill="#F1F5F9" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">Pyth / Switchboard TWAP</text>
  <text x="170" y="296" fill="#64748B" font-family="sans-serif" font-size="11" text-anchor="middle">Confidence Interval Bounds</text>

  <rect x="60" y="330" width="220" height="65" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="170" y="356" fill="#F1F5F9" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">Slippage Delta &gt; BPS Limit</text>
