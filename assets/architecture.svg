  <rect x="370" y="330" width="220" height="65" rx="8" fill="#1e1b4b" stroke="#6366F1" stroke-width="1"/>
  <text x="480" y="356" fill="#F1F5F9" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">Cooldown Slot Recovery</text>
  <text x="480" y="378" fill="#14F195" font-family="sans-serif" font-size="11" text-anchor="middle">resume_liquidity() Post Stabilization</text>

  <!-- 3. Client SDK & Automation -->
  <rect x="660" y="110" width="260" height="310" rx="12" fill="url(#panelGrad)" stroke="#334155" stroke-width="1.5"/>
