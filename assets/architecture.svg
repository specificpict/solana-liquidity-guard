  <rect x="680" y="170" width="220" height="60" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="790" y="196" fill="#F1F5F9" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">SlippageEvaluator</text>
  <text x="790" y="216" fill="#38BDF8" font-family="sans-serif" font-size="11" text-anchor="middle">BPS Math &amp; Volatility Thresholds</text>

  <rect x="680" y="250" width="220" height="60" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="790" y="276" fill="#F1F5F9" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">WebSocket Slot Poller</text>
  <text x="790" y="296" fill="#38BDF8" font-family="sans-serif" font-size="11" text-anchor="middle">Slot Progression &amp; Event Stream</text>

  <rect x="680" y="330" width="220" height="65" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="790" y="356" fill="#F1F5F9" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">Keeper Bot Action</text>
  <text x="790" y="378" fill="#14F195" font-family="sans-serif" font-size="11" text-anchor="middle">Automated Slashing &amp; Emergency Halt</text>

  <!-- Connective Arrows -->
  <path d="M 300 200 L 350 200" stroke="#14F195" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow)"/>
  <path d="M 610 200 L 660 200" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4"/>
  <path d="M 660 280 L 610 280" stroke="#F43F5E" stroke-width="2"/>
