  <text x="170" y="136" fill="#14F195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" text-anchor="middle">1. DEX Reserve Feeds</text>
  
  <rect x="60" y="170" width="220" height="60" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
